name: Atualizar prints dos projetos

on:
  schedule:
    - cron: "30 6 * * 1"      # toda segunda-feira
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scripts/capture_screens.py
      - name: Listar prints
        run: ls -la assets/screens
      - name: Salvar prints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/screens
          git diff --cached --quiet || (git commit -m "Atualiza prints dos projetos" && git push)
